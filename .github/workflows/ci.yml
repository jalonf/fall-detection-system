name: TFG Validations

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Prevent concurrent runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Enable pip caching to significantly reduce build times
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. CI/CD quality tools
          pip install ruff pytest
          
          # 2. Core project dependencies
          if [ -f requirements.txt ]; then 
            # CLAVE: Añadir --extra-index-url para que pip encuentre la versión +cpu de PyTorch
            pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          else
            pip install opencv-python opencv-contrib-python "mediapipe==0.10.*" peewee pydantic PySide6
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Code Quality & Linter
        run: |
          # Ruff replaces Flake8: it uses the same rulesets but executes blazingly fast
          ruff check src/