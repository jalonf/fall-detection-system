name: TFG Validations

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Prevent concurrent runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Enable pip caching to significantly reduce build times
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Linter, plus the project dependencies to check that they install
          pip install ruff==0.17.1
          pip install -r requirements.txt

      - name: Code Quality & Linter
        run: |
          # Ruff replaces Flake8: it uses the same rulesets but executes blazingly fast
          ruff check src/ training/
